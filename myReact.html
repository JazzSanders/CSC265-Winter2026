    <header class="header-mini text-center">
        <div class="container">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        // --- REACT COMPONENT 1: TaskTracker ---
        function TaskTracker() {
            const [tasks, setTasks] = useState([]);
            const [inputValue, setInputValue] = useState('');

            const handleAddTask = (e) => {
                e.preventDefault();
                if (inputValue.trim() !== '') {
                    const newTask = { id: Date.now(), text: inputValue, completed: false };
                    setTasks([...tasks, newTask]);
                    setInputValue(''); 
                }
            };

            const toggleComplete = (id) => {
                setTasks(tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                ));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(task => task.id !== id));
            };

            return (
                <div className="card project-card shadow-sm p-4 h-100">
                    <h3 className="card-title text-success mb-4"><i class="fas fa-tasks me-2"></i>Task Tracker</h3>
                    <form onSubmit={handleAddTask} className="mb-4 d-flex">
                        <input 
                            type="text" 
                            className="form-control me-2" 
                            placeholder="Add a new task..." 
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}
                        />
                        <button type="submit" className="btn btn-success px-4 shadow-sm">Add</button>
                    </form>

                    {tasks.length === 0 ? (
                        <div className="text-center text-muted p-4 bg-light rounded">
                            <p className="mb-0 fst-italic">No tasks yet.</p>
                        </div>
                    ) : (
                        <ul className="list-group">
                            {tasks.map(task => (
                                <li key={task.id} className="list-group-item d-flex justify-content-between align-items-center">
                                    <span 
                                        style={{ 
                                            textDecoration: task.completed ? 'line-through' : 'none', 
                                            cursor: 'pointer',
                                            color: task.completed ? '#6c757d' : '#000'
                                        }}
                                        onClick={() => toggleComplete(task.id)}
                                    >
                                        {task.completed ? <i className="fas fa-check-circle text-success me-3"></i> : <i className="far fa-circle text-secondary me-3"></i>}
                                        {task.text}
                                    </span>
                                    <button className="btn btn-sm btn-outline-danger border-0" onClick={() => deleteTask(task.id)}>
                                        <i className="fas fa-trash"></i>
                                    </button>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        // --- REACT COMPONENT 2: SavingsCalculator ---
        function SavingsCalculator() {
            // State (Lesson Topic)
            const [goal, setGoal] = useState(1000);
            const [saved, setSaved] = useState(0);

            // Calculation Logic
            const progress = Math.min((saved / goal) * 100, 100).toFixed(1);

            return (
                <div className="card project-card shadow-sm p-4 h-100">
                    <h3 className="card-title text-success mb-4"><i class="fas fa-piggy-bank me-2"></i>Savings Goal</h3>
                    
                    <div className="mb-3">
                        <label className="form-label small fw-bold">Savings Goal ($)</label>
                        <input 
                            type="number" 
                            className="form-control" 
                            value={goal} 
                            onChange={(e) => setGoal(Number(e.target.value))} 
                        />
                    </div>

                    <div className="mb-4">
                        <label className="form-label small fw-bold">Amount Saved ($)</label>
                        <input 
                            type="number" 
                            className="form-control" 
                            value={saved} 
                            onChange={(e) => setSaved(Number(e.target.value))} 
                        />
                    </div>

                    <div className="text-center mb-3">
                        <h4 className="fw-bold">{progress}% Reached</h4>
                        <div className="progress" style={{ height: '25px' }}>
                            <div 
                                className="progress-bar bg-success progress-bar-striped progress-bar-animated" 
                                role="progressbar" 
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    </div>

                    <p className="text-center text-muted small">
                        {saved >= goal ? "Congratulations! Goal achieved! 🎉" : `You need $${(goal - saved).toLocaleString()} more to hit your goal.`}
                    </p>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            return (
                <div className="row g-4 justify-content-center">
                    <div className="col-lg-6">
                        <TaskTracker />
                    </div>
                    <div className="col-lg-6">
                        <SavingsCalculator />
                    </div>
                </div>
            );
        }

        // Render the main App
        const root = ReactDOM.createRoot(document.getElementById('react-root'));
        root.render(<App />);
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Triangle Perimeter & Area Calculator</h2>
        <div class="input-group">
            <label>Vertex 1 (x1, y1):</label>
            <input type="number" id="x1" value="1">
            <input type="number" id="y1" value="0">
        </div>
        <div class="input-group">
            <label>Vertex 2 (x2, y2):</label>
            <input type="number" id="x2" value="2">
            <input type="number" id="y2" value="4">
        </div>
        <div class="input-group">
            <label>Vertex 3 (x3, y3):</label>
            <input type="number" id="x3" value="4">
            <input type="number" id="y3" value="3">
        </div>
        <button onclick="calculate()">Calculate</button>

        <div class="results">
            <p><strong>Perimeter:</strong> <span id="perimeterResult">-</span></p>
            <p><strong>Area:</strong> <span id="areaResult">-</span></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>

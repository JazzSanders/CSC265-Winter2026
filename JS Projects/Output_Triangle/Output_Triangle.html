<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Output</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Triangle Drawer</h1>
        <p>Enter a size and check the <strong>Console (F12)</strong>!</p>
        
        <div class="input-group">
            <input type="number" id="tSize" value="4" min="1">
            <button onclick="handleDraw()">Draw Triangle</button>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        function handleDraw() {
            const size = document.getElementById('tSize').value;
            // Convert string input to integer
            drawTriangle(parseInt(size));
        }
    </script>
</body>
</html>

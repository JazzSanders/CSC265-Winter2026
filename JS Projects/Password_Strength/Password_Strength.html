<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Password Check</h1>
        <p>Enter a password to test its strength.</p>
        
        <input type="password" id="pwInput" placeholder="Enter password...">
        <button onclick="handleCheck()">Check Strength</button>
        
        <div id="statusBox" class="status-box"></div>
    </div>

    <script src="index.js"></script>
    <script>
        function handleCheck() {
            const pw = document.getElementById('pwInput').value;
            const statusBox = document.getElementById('statusBox');
            
            if (isStrongPassword(pw)) {
                statusBox.textContent = "Strong Password!";
                statusBox.className = "status-box strong";
            } else {
                statusBox.textContent = "Weak Password (Check criteria)";
                statusBox.className = "status-box weak";
            }
        }
    </script>
</body>
</html>
